{% extends 'base.html' %}

{% block content %}
<h1>Přidat záznam</h1>

<form method="post">
    {% csrf_token %}

    <label>Nápoj:</label>
    <select name="drink">
        {% for drink in drinks %}
            <option value="{{ drink.id }}">{{ drink.name }}</option>
        {% endfor %}
    </select>

    <label>Počet:</label>
    <input type="number" name="amount" value="1">

    <button class="btn" type="submit">Uložit</button>
</form>
{% endblock %}
